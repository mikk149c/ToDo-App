name: PR checks

on:
  pull_request:
    branches:
      - main

# Read-only on purpose, so the workflow also works for pull requests from forks
permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Minimum line coverage (percent) of the ToDo-App class library. 0 = report only.
  # See "Tests and coverage" in README.md.
  COVERAGE_THRESHOLD: 95

jobs:
  coverage:
    # This name is the required status check on main. Don't rename it without updating branch protection.
    name: Tests and coverage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test with coverage
        run: dotnet test ToDo-App.Tests/ToDo-App.Tests.csproj -c Release --collect "XPlat Code Coverage" --results-directory coverage

      - name: Coverage report
        shell: pwsh
        run: ./.github/scripts/Check-Coverage.ps1 -ReportPath coverage -Threshold $env:COVERAGE_THRESHOLD

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore
