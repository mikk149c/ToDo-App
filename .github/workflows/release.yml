name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIP_NAME: ToDo-App-win-x64.zip
  # main publishes the public "latest" release; any other branch publishes a "test-build" pre-release.
  RELEASE_TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || 'test-build' }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test ToDo-App.Tests/ToDo-App.Tests.csproj -c Release

      - name: Publish
        run: dotnet publish ToDo-App.UI/ToDo-App.UI.csproj -c Release -p:Platform=x64 -o publish/ToDo-App

      - name: Zip
        run: Compress-Archive -Path publish/ToDo-App -DestinationPath $env:ZIP_NAME

      - name: Replace release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete the old release and its tag so the tag moves to this commit.
          gh release delete $env:RELEASE_TAG --cleanup-tag --yes 2>$null
          $LASTEXITCODE = 0

          $flags = @()
          if ($env:RELEASE_TAG -ne 'latest') { $flags += '--prerelease' }

          gh release create $env:RELEASE_TAG $env:ZIP_NAME `
            --target $env:GITHUB_SHA `
            --title "ToDo-App ($env:RELEASE_TAG)" `
            --notes "Built from commit $env:GITHUB_SHA. Download $env:ZIP_NAME, unzip it and run ToDo-App.UI.exe." `
            @flags
